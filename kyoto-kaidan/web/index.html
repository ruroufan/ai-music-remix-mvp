<!doctype html>
<html><head><meta charset="utf-8"><title>京都怪谈 renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1080px;height:1920px}</style></head>
<body><canvas id="c"></canvas>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="ripple" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.05" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<script type="module" src="main.js"></script></body></html>
