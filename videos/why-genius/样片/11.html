<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 数据信息图 · 42.195 公里归零</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1840}
canvas{position:absolute;inset:0;margin:auto;display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, D = 8;
const ctx = document.getElementById('c').getContext('2d');
const SANS = '"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif';
const MONO = '"SF Mono","JetBrains Mono","Menlo","Consolas","DejaVu Sans Mono",monospace';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ORA = '#ff8b3d', TEAL = '#3ee0c5', PINK = '#ff5c8a', FG = '#f5f3ff', DIM = '#8e88c9';
const stars = (() => { const r = rng(2), a = []; for (let i = 0; i < 90; i++) a.push([r() * W, r() * H, 1 + r() * 2.5, r()]); return a; })();

function text(s, x, y, size, col, a = 1, align = 'center', font = SANS, weight = 800) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();
}
function runner(x, y, col, phase, sit) { // feet at y
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 4, 60, 12, 0, 0, 7); ctx.fill();
  const lift = sit ? 40 : 0;
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 18;
  const a = sit ? 1.2 : Math.sin(phase) * 0.6;
  ctx.beginPath(); ctx.moveTo(0, -90 + lift); ctx.lineTo(Math.sin(a) * 60, -90 + lift + Math.cos(a) * 80); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -90 + lift); ctx.lineTo(-Math.sin(a) * 60, -90 + lift + Math.cos(a) * 80); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-34, -200 + lift, 68, 120, 34); ctx.fill();
  ctx.fillStyle = '#ffe1c7'; ctx.beginPath(); ctx.arc(0, -238 + lift, 40, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1840'; ctx.beginPath(); ctx.arc(14, -240 + lift, 6, 0, 7); ctx.fill();
  ctx.restore();
}

function render(t) {
  ctx.fillStyle = '#1b1840'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, v] of stars) { ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.25 * Math.sin(t * 2 + v * 10) ** 2})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  const endK = eo(seg(t, 5.7, 6.1));
  ctx.save(); ctx.globalAlpha = 1 - endK * 0.95;

  // track
  const TX0 = 300, TX1 = 1700, TY = 760;
  const grow = eo(seg(t, 1.0, 1.8));
  const shrink = eio(seg(t, 3.7, 4.5));
  const len = (TX1 - TX0) * grow * (1 - shrink);
  ctx.fillStyle = '#2c2866'; ctx.beginPath(); ctx.roundRect(TX0, TY, (TX1 - TX0) * grow, 46, 23); ctx.fill();
  ctx.fillStyle = ORA; ctx.beginPath(); ctx.roundRect(TX0, TY, Math.max(46, len), 46, 23); ctx.fill();
  // finish flag
  if (grow > 0.9) {
    ctx.save(); ctx.globalAlpha *= (1 - shrink);
    ctx.fillStyle = FG; ctx.fillRect(TX1 - 6, TY - 210, 10, 256);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ctx.fillStyle = (i + j) % 2 ? FG : '#1b1840'; ctx.fillRect(TX1 + 4 + i * 24, TY - 210 + j * 24, 24, 24); }
    ctx.restore();
  }
  // runner (you) at start, sits down after it collapses
  runner(TX0 - 20, TY - 6, TEAL, t * 10 * (t < 3.7 ? 1 : 0), t > 4.4);
  text('你', TX0 - 20, TY + 100, 56, TEAL);

  // big number
  let km;
  if (t < 3.7) km = 42.195 * eo(seg(t, 1.9, 3.0)); else km = 42.195 * (1 - shrink);
  const na = eo(seg(t, 1.9, 2.2));
  text(km.toFixed(3), 1420, 400, 170, FG, na, 'right', MONO, 800);
  text('km', 1450, 430, 72, DIM, na, 'left', MONO, 700);
  text(t < 4.5 ? '要追的距离' : '不用追了', 1420, 540, 60, t < 4.5 ? ORA : PINK, na * (1 - seg(t, 5.0, 5.2)), 'right');

  // excuse tag flying in
  const fk = back(seg(t, 3.1, 3.6));
  if (fk > 0) {
    const x = lerp(2300, 1000, fk), y = TY - 120;
    ctx.save(); ctx.globalAlpha *= 1 - seg(t, 5.0, 5.3);
    ctx.fillStyle = PINK; ctx.beginPath(); ctx.roundRect(x - 260, y - 60, 520, 120, 60); ctx.fill();
    text('他天生体质好', x, y + 2, 64, '#1b1840'); ctx.restore();
  }
  // results board
  const rb = eo(seg(t, 4.6, 5.0));
  if (rb > 0) {
    ctx.save(); ctx.globalAlpha *= rb; ctx.translate(0, (1 - rb) * 60);
    ctx.fillStyle = '#2c2866'; ctx.beginPath(); ctx.roundRect(1080, 640, 620, 210, 24); ctx.fill();
    text('他', 1130, 700, 56, FG, 1, 'left'); text('完赛', 1660, 700, 56, ORA, 1, 'right');
    text('你', 1130, 790, 56, TEAL, 1, 'left'); text('DNS 未上场', 1660, 790, 56, PINK, 1, 'right', SANS);
    ctx.restore();
  }
  ctx.restore();
  text('朋友跑完一场全马', 960, 140, 136, FG, eo(seg(t, 0.1, 0.5)) * (1 - seg(t, 1.9, 2.2)));
  const ca = eo(seg(t, 6.0, 6.4));
  text('你要的不是真相', 960, 430, 140, FG, ca);
  text('是一个不必比的理由', 960, 640, 140, ORA, eo(seg(t, 6.3, 6.7)));
}

const q = new URLSearchParams(location.search);
if (q.has('t')) render(+q.get('t'));
else { let t0 = null; const loop = n => { if (t0 === null) t0 = n; render(((n - t0) / 1000) % D); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
