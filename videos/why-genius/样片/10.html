<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 地图动画 · 本可以开始的地方</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e7d4a8}
canvas{position:absolute;inset:0;margin:auto;display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, D = 8;
const ctx = document.getElementById('c').getContext('2d');
const SERIF = '"Songti SC","Noto Serif CJK SC","STSong","SimSun","WenQuanYi Zen Hei",serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const INK = '#3a2a18', VERM = '#c23a22';

const stains = (() => { const r = rng(4), a = []; for (let i = 0; i < 18; i++) a.push([r() * W, r() * H, 80 + r() * 260, r()]); return a; })();
const mountains = (() => { const r = rng(8), a = []; for (let i = 0; i < 22; i++) { const x = r() * W, y = 220 + r() * 760; if (Math.hypot(x - 960, y - 520) < 200) continue; a.push([x, y, 60 + r() * 90, 50 + r() * 80]); } return a; })();
// route: bezier through 3 stations
const ST = [[400, 700], [960, 470], [1520, 720]];
const route = (() => { const pts = [], c = [[150, 900], [260, 820], ...ST.flatMap((p, i) => i < 2 ? [p, [lerp(p[0], ST[i + 1][0], .5), (i ? 820 : 360)]] : [p]), [1780, 600]];
  for (let i = 0; i < c.length - 1; i++) for (let j = 0; j < 20; j++) { const k = j / 20; pts.push([lerp(c[i][0], c[i + 1][0], k), lerp(c[i][1], c[i + 1][1], k) + Math.sin(k * Math.PI) * 30 * (i % 2 ? 1 : -1)]); }
  pts.push(c[c.length - 1]); return pts; })();
const stIdx = ST.map(s => { let best = 0, bd = 1e9; route.forEach((p, i) => { const d = Math.hypot(p[0] - s[0], p[1] - s[1]); if (d < bd) { bd = d; best = i; } }); return best; });
const STATIONS = [
  { name: '吉他 · 第三周', say: '“我没这根筋”', at: 1.9, side: 'above' },
  { name: '全马 · 起跑线', say: '“他天生体质好”', at: 3.1, side: 'below' },
  { name: '升职 · 第一年', say: '“人家脑子好使”', at: 4.3, side: 'above' },
];

function parchment() {
  ctx.fillStyle = '#e7d4a8'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, v] of stains) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(150,105,50,${0.08 + v * 0.08})`); g.addColorStop(1, 'rgba(150,105,50,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
  const v = ctx.createRadialGradient(960, 540, 500, 960, 540, 1150); v.addColorStop(0, 'rgba(90,55,20,0)'); v.addColorStop(1, 'rgba(90,55,20,0.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // ink mountains
  for (const [x, y, w, h] of mountains) {
    const g = ctx.createLinearGradient(x, y - h, x, y); g.addColorStop(0, 'rgba(58,42,24,0.55)'); g.addColorStop(1, 'rgba(58,42,24,0.05)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w * 0.3, y - h * 0.6, x, y - h); ctx.quadraticCurveTo(x + w * 0.35, y - h * 0.5, x + w, y); ctx.closePath(); ctx.fill();
  }
  // river
  ctx.strokeStyle = 'rgba(70,100,120,0.35)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, 300); ctx.bezierCurveTo(500, 380, 700, 160, 1200, 260); ctx.bezierCurveTo(1500, 320, 1700, 200, 1920, 240); ctx.stroke();
}
function routeDraw(k) {
  const n = Math.floor((route.length - 1) * k);
  ctx.save(); ctx.strokeStyle = VERM; ctx.lineWidth = 9; ctx.setLineDash([26, 16]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(...route[0]); for (let i = 1; i <= n; i++) ctx.lineTo(...route[i]); ctx.stroke(); ctx.restore();
  return route[n];
}
function seal(x, y, k, rot) {
  if (k <= 0) return;
  const s = lerp(1.8, 1, eo(k));
  ctx.save(); ctx.globalAlpha *= Math.min(1, k * 2); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(194,40,28,0.92)'; ctx.beginPath(); ctx.roundRect(-76, -50, 152, 100, 8); ctx.fill();
  ctx.strokeStyle = '#f2dcc0'; ctx.lineWidth = 4; ctx.strokeRect(-64, -38, 128, 76);
  ctx.fillStyle = '#f7e6cf'; ctx.font = `900 52px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('缺席', 0, 2);
  ctx.restore();
}
function text(s, x, y, size, col, a = 1, align = 'center', weight = 900) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `${weight} ${size}px ${SERIF}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(231,212,168,0.9)'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();
}

function render(t) {
  parchment();
  const endK = eo(seg(t, 5.7, 6.1));
  ctx.save(); ctx.globalAlpha = 1 - endK * 0.9;
  const k = eio(seg(t, 1.2, 5.2));
  const head = routeDraw(k);
  const prog = Math.floor((route.length - 1) * k);
  STATIONS.forEach((s, i) => {
    if (prog < stIdx[i]) return;
    const [x, y] = ST[i];
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill();
    ctx.fillStyle = '#e7d4a8'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    const a = eo(seg(t, s.at, s.at + 0.3)) * (1 - seg(t, 5.5, 5.7));
    const dy = s.side === 'above' ? -1 : 1;
    text(s.name, x, y + dy * 120, 66, INK, a);
    text(s.say, x, y + dy * 120 + 78 * (dy < 0 ? -1 : 1) * -1 * -1 + (dy < 0 ? 0 : 0), 44, '#6a4a28', a, 'center', 700);
    seal(x + 200, y + dy * 10, seg(t, s.at + 0.4, s.at + 0.7), -0.12 + i * 0.08);
  });
  // traveller dot
  if (k > 0 && k < 1) { ctx.fillStyle = VERM; ctx.beginPath(); ctx.arc(head[0], head[1], 14, 0, 7); ctx.fill(); }
  ctx.restore();
  text('那些起点', 960, 120, 140, INK, eo(seg(t, 0.1, 0.5)) * (1 - seg(t, 1.9, 2.2)));
  const ca = eo(seg(t, 6.0, 6.4));
  text('在本可以开始的地方', 960, 430, 140, INK, ca);
  text('你都缺席', 960, 640, 170, VERM, eo(seg(t, 6.3, 6.7)));
}

const q = new URLSearchParams(location.search);
if (q.has('t')) render(+q.get('t'));
else { let t0 = null; const loop = n => { if (t0 === null) t0 = n; render(((n - t0) / 1000) % D); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
