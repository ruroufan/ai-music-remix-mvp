<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>努力与天赋</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fbf3e2}
canvas{position:absolute;inset:0;margin:auto;display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 绘本科普风格全片：钢笔线 + 蜡笔涂色，线条每 1/8 秒微微抖动。画面只由 t 决定；?t=秒 只画那一帧。
const W = 1920, H = 1080, D = 126;
const ctx = document.getElementById('c').getContext('2d');
const HAND = '"Kaiti SC","STKaiti","KaiTi","WenQuanYi Zen Hei",serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const bounce = k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; };
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PAPER = '#fbf3e2', INK = '#2b2219', RED = '#d8342a', BLUE = '#6aa6d8', ORANGE = '#f2a34a', GOLD = '#f4b81f',
  GREEN = '#7cbf7a', BROWN = '#a8703f', SKIN = '#e9b48f', GREY = '#b9b2a6', WHITE = '#ffffff', MUTED = '#6a5a48';

// ---------- drawing kit ----------
const grain = (() => { const r = rng(5), a = []; for (let i = 0; i < 1600; i++) a.push([r() * W, r() * H, r()]); return a; })();
let boil = rng(1);
function shapePts(fn, n = 48, amp = 3) { const pts = []; for (let i = 0; i <= n; i++) { const [x, y] = fn(i / n); pts.push([x + (boil() - .5) * amp, y + (boil() - .5) * amp]); } return pts; }
function trace(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); }
function crayon(pts, col, seed, density = 1) {
  ctx.save(); trace(pts); ctx.closePath(); ctx.clip();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const r = rng(seed); ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.globalAlpha *= 0.55; ctx.lineCap = 'round';
  for (let x = x0 - (y1 - y0); x < x1; x += 11 / density) { ctx.beginPath(); ctx.moveTo(x + r() * 6, y1 + 5); ctx.lineTo(x + (y1 - y0) + r() * 6, y0 - 5); ctx.stroke(); }
  ctx.restore();
}
function inkLine(pts, w = 5, col = INK) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; trace(pts); ctx.stroke(); ctx.restore(); }
const ell = (cx, cy, rx, ry) => k => [cx + Math.cos(k * Math.PI * 2) * rx, cy + Math.sin(k * Math.PI * 2) * ry];
const line = (x0, y0, x1, y1) => k => [lerp(x0, x1, k), lerp(y0, y1, k)];
function rectPts(x, y, w, h) { return shapePts(k => { const p = k * 4, e = Math.floor(p) % 4, f = p - Math.floor(p);
  return e === 0 ? [x + w * f, y] : e === 1 ? [x + w, y + h * f] : e === 2 ? [x + w - w * f, y + h] : [x, y + h - h * f]; }, 24, 3); }
function blob(cx, cy, rx, ry, col, seed, w = 5) { const pts = shapePts(ell(cx, cy, rx, ry)); crayon(pts, col, seed); inkLine(pts, w); }
function box(x, y, w, h, col, seed, lw = 5) { const pts = rectPts(x, y, w, h); crayon(pts, col, seed); inkLine(pts, lw); }
function stroke(fn, n = 12, w = 5, col = INK) { inkLine(shapePts(fn, n, 2.5), w, col); }
function at(x, y, s, fn, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); fn(); ctx.restore(); }
function say(s, x, y, size, col = INK, a = 1, align = 'center', halo = true) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `700 ${size}px ${HAND}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (halo) { ctx.lineWidth = Math.max(8, size * 0.14); ctx.lineJoin = 'round'; ctx.strokeStyle = PAPER; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();
}
function star(cx, cy, r, col, seed) { const pts = shapePts(k => { const a = k * Math.PI * 2 - Math.PI / 2, i = Math.round(k * 10); const rr = i % 2 ? r * 0.45 : r; const a2 = (i / 10) * Math.PI * 2 - Math.PI / 2; return [cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr]; }, 10, 3); crayon(pts, col, seed); inkLine(pts, 4); }
function ground(y = 860, x0 = 120, x1 = 1800) { inkLine(shapePts(k => [x0 + k * (x1 - x0), y + Math.sin(k * 9) * 6], 30, 2), 4); }

// round crayon character, feet at (x, y)
function person(x, y, o = {}) {
  const s = o.s || 1, col = o.col || BLUE, seed = o.seed || 31, lx = (o.look && o.look[0]) || 0, ly = (o.look && o.look[1]) || 0;
  at(x, y, s, () => {
    if (o.ghost) {
      ctx.save(); ctx.setLineDash([18, 14]); ctx.strokeStyle = GREY; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, -150, 120, 140, 0, 0, 7); ctx.stroke(); ctx.restore(); return;
    }
    if (o.glow) { const g = ctx.createRadialGradient(0, -170, 20, 0, -170, 330); g.addColorStop(0, `rgba(255,214,90,${0.55 * o.glow})`); g.addColorStop(1, 'rgba(255,214,90,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -170, 330, 0, 7); ctx.fill(); }
    stroke(k => [-50 + k * 10, -12 + k * 14], 4); stroke(k => [40 + k * 10, -12 + k * 14], 4);
    if (o.arms) for (const [ax, ay, bx, by] of o.arms) stroke(line(ax, ay, bx, by), 6, 6);
    blob(0, -150, 120, 140, col, seed);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-38 + lx, -180 + ly, 9, 0, 7); ctx.arc(38 + lx, -180 + ly, 9, 0, 7); ctx.fill();
    const m = o.mood || 'flat';
    if (m === 'puff') inkLine(shapePts(ell(6, -128, 18, 14)));
    else if (m === 'sad') stroke(k => [-24 + k * 48, -120 - Math.sin(k * Math.PI) * 10], 8);
    else if (m === 'happy') stroke(k => [-34 + k * 68, -136 + Math.sin(k * Math.PI) * 18], 8);
    else stroke(k => [-26 + k * 52, -132 + Math.sin(k * Math.PI) * 10], 8);
    if (o.crown) {
      const pts = shapePts(k => { const i = Math.min(6, Math.floor(k * 6)); const tx = [-60, -60, -30, 0, 30, 60, 60][i]; const ty = [0, -70, -30, -80, -30, -70, 0][i]; return [tx, -290 + ty]; }, 6, 4);
      crayon(pts, GOLD, seed + 9); inkLine(pts);
    }
  });
}
function bubble(s, x, y, size = 64, tail = null, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.font = `700 ${size}px ${HAND}`;
  const rx = ctx.measureText(s).width / 2 + 60, ry = size * 0.75 + 26;
  if (tail) { const pts = shapePts(k => k < .5 ? [lerp(x - 30, tail[0], k * 2), lerp(y + ry * 0.6, tail[1], k * 2)] : [lerp(tail[0], x + 30, k * 2 - 1), lerp(tail[1], y + ry * 0.6, k * 2 - 1)], 8, 2); crayon(pts, WHITE, 77, 2); inkLine(pts, 4); }
  const pts = shapePts(ell(x, y, rx, ry)); crayon(pts, WHITE, 7, 2); inkLine(pts);
  ctx.restore(); say(s, x, y + 2, size, INK, a, 'center', false);
}
function stamp(s, x, y, k, rot = -0.15, size = 60) {
  if (k <= 0) return;
  at(x, y, lerp(1.8, 1, eo(k)), () => {
    ctx.globalAlpha *= Math.min(1, k * 2);
    const w = size * s.length + 50, h = size + 36;
    inkLine(rectPts(-w / 2, -h / 2, w, h), 7, RED);
    say(s, 0, 2, size, RED, 1, 'center', false);
  }, rot);
}
function paper() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(160,120,70,0.10)'; for (const [x, y, v] of grain) ctx.fillRect(x, y, 2 + v * 2, 2);
}
function guitar(x, y, s, rot) {
  at(x, y, s, () => {
    box(-10, -22, 300, 44, '#6b4a2a', 41, 4);
    blob(-60, 0, 120, 92, BROWN, 42);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-50, 0, 24, 0, 7); ctx.fill();
  }, rot);
}
function hands(x, y, s) { // a pair of worn palms, facing up
  at(x, y, s, () => {
    for (const [hx, f] of [[-90, 1], [90, -1]]) {
      at(hx, 0, 1, () => {
        ctx.scale(f, 1);
        for (let i = 0; i < 4; i++) blob(-54 + i * 30, -58, 13, 34, SKIN, 60 + i, 4);
        blob(0, 0, 76, 46, SKIN, 50, 5);
        ctx.fillStyle = '#8a5530'; for (const [cx, cy] of [[-34, -14], [-6, -18], [22, -12], [2, 10], [-22, 8]]) { ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 7); ctx.fill(); }
      });
    }
  });
}
function lamp(x, y, s, on) {
  at(x, y, s, () => {
    if (on > 0) {
      const g = ctx.createRadialGradient(-60, 40, 10, -40, 120, 360); g.addColorStop(0, `rgba(255,205,90,${0.6 * on})`); g.addColorStop(1, 'rgba(255,205,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-40, 120, 360, 0, 7); ctx.fill();
      const cone = shapePts(k => k < .5 ? [lerp(-120, -260, k * 2), lerp(-150, 230, k * 2)] : [lerp(40, 160, (k - .5) * 2), lerp(230, -100, (k - .5) * 2)], 6, 3);
      ctx.save(); ctx.globalAlpha *= on * 0.7; crayon(cone, '#ffe08a', 88, 0.8); ctx.restore();
    }
    stroke(line(60, 230, 90, 20), 6, 9); stroke(line(90, 20, -20, -120), 6, 9);
    box(40, 222, 120, 26, '#5a5a62', 81, 4);
    const shade = shapePts(k => { const i = Math.min(3, Math.floor(k * 3)); return [[-150, -120], [-20, -200], [10, -110], [-150, -120]][i]; }, 3, 3);
    crayon(shade, '#5a5a62', 82); inkLine(shade, 5);
    blob(-70, -116, 22, 22, on > 0 ? '#fff1a8' : '#e8e2d0', 83, 4);
  });
}
function bench(x, y, w, seed = 90) { box(x, y, w, 46, BROWN, seed); box(x + 30, y + 46, 30, 150, '#7a4f2a', seed + 1, 4); box(x + w - 60, y + 46, 30, 150, '#7a4f2a', seed + 2, 4); }

// ---------- scenes (global time t) ----------
function sTitle(t) {
  ground();
  person(760, 860, { s: 0.7, col: BLUE, seed: 31 });
  person(1160, 860, { s: 0.7, col: ORANGE, seed: 21, crown: true });
  say('努力与天赋', 960, 320, 180, INK, eo(seg(t, 0.2, 0.8)));
  say('为什么我们急着说别人是天才', 960, 490, 60, MUTED, eo(seg(t, 0.9, 1.4)));
}

function sSigh(t) {
  ground();
  person(1380, 860, { col: ORANGE, seed: 21, crown: true });
  say('他', 1380, 920, 56, INK, 1, 'center', false);
  person(560, 860, { col: BLUE, seed: 31, mood: t > 6.6 ? 'puff' : 'flat' });
  say('你', 560, 920, 56, INK, 1, 'center', false);
  bubble('他是天才！', 1020, 380, 76, [1180, 560], eo(seg(t, 4.3, 4.6)) * (1 - seg(t, 6.4, 6.7)));
  const g = back(seg(t, 6.7, 7.3));
  if (g > 0) {
    const cx = lerp(640, 820, g), cy = lerp(740, 450, g), rx = 300 * g, ry = 175 * g;
    const pts = shapePts(k => { const a = k * Math.PI * 2; const w = 1 + 0.12 * Math.sin(a * 7); return [cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]; }, 64);
    crayon(pts, '#e7e1d5', 13, 1.5); inkLine(pts, 4);
    say('呼——', cx, cy - 10, 76, '#8a7a66', seg(t, 7.0, 7.3) * (1 - seg(t, 9.6, 9.8)), 'center', false);
    say('服气？', cx - 80, cy - 20, 84, INK, seg(t, 10.0, 10.3), 'center', false);
    const cr = seg(t, 10.8, 11.1);
    if (cr > 0) { stroke(line(cx - 210, cy - 72, lerp(cx - 210, cx + 40, cr), lerp(cy - 72, cy + 32, cr)), 6, 12, RED); stroke(line(cx + 40, cy - 72, lerp(cx + 40, cx - 210, cr), lerp(cy - 72, cy + 32, cr)), 6, 12, RED); }
    say('开脱', cx + 160, cy + 50, 120, RED, eo(seg(t, 11.8, 12.2)), 'center', false);
  }
}

function sNietzsche(t) {
  ground(860, 520, 1800);
  // Nietzsche bust
  at(330, 0, 1, () => {
    const coat = shapePts(k => { const i = Math.min(4, Math.floor(k * 4)); return [[-150, 560], [150, 560], [190, 820], [-190, 820], [-150, 560]][i]; }, 4, 3);
    crayon(coat, '#4a4a58', 101); inkLine(coat);
    blob(0, 420, 105, 128, SKIN, 102);
    const hair = shapePts(k => [Math.cos(Math.PI + k * Math.PI) * 112, 360 + Math.sin(Math.PI + k * Math.PI) * 100], 16, 6);
    crayon(hair, '#6d6a66', 103, 1.5); inkLine(hair);
    const mus = shapePts(k => { const a = Math.PI + k * Math.PI * 2; return [Math.cos(a) * 78, 468 + Math.abs(Math.sin(a)) * 36 * (k < .5 ? 1 : -0.4)]; }, 24, 4);
    crayon(mus, '#4b3a2a', 104, 1.6); inkLine(mus, 4);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-36, 410, 8, 0, 7); ctx.arc(36, 410, 8, 0, 7); ctx.fill();
    stroke(line(-60, 386, -18, 392), 4, 5); stroke(line(18, 392, 60, 386), 4, 5);
  });
  say('尼采', 330, 880, 64, INK);
  person(900, 860, { s: 0.8, col: BLUE, seed: 31, mood: t > 21.2 ? 'happy' : 'flat', look: [8, 0] });
  // miracle halo around him
  const ha = eo(seg(t, 17.2, 17.8));
  if (ha > 0) {
    ctx.save(); ctx.globalAlpha *= ha;
    const ring = shapePts(ell(1450, 680, 270, 270), 60, 5);
    ctx.save(); trace(ring); ctx.fillStyle = 'rgba(255,224,120,0.25)'; ctx.fill(); ctx.restore();
    inkLine(ring, 16, 'rgba(244,184,31,0.8)'); inkLine(ring, 4);
    ctx.restore();
    say('奇迹', 1450, 350, 96, '#c9870f', ha);
  }
  person(1450, 860, { s: 0.85, col: ORANGE, seed: 21, crown: true });
  // thorns fly out and break on the halo
  for (let i = 0; i < 3; i++) {
    const k = seg(t, 20.0 + i * 0.35, 20.6 + i * 0.35); if (k <= 0) continue;
    const y = 640 + (i - 1) * 80;
    if (k < 1) { const x = lerp(1360, 1190, eo(k)); const pts = shapePts(kk => { const j = Math.min(3, Math.floor(kk * 3)); return [[x, y - 18], [x - 70, y], [x, y + 18], [x, y - 18]][j]; }, 3, 2); crayon(pts, RED, 120 + i); inkLine(pts, 4); }
    else { const b = seg(t, 20.6 + i * 0.35, 21.4 + i * 0.35); ctx.save(); ctx.globalAlpha *= 1 - b; star(1170 - b * 30, y - b * 40, 26, GOLD, 130 + i); ctx.restore(); }
  }
}

function sRelease(t) {
  ground();
  const cut = t > 26.0;
  // stone
  blob(360, 790, 160, 92, GREY, 140);
  say('比较', 360, 792, 64, INK, 1, 'center', false);
  const hop = cut ? Math.sin(Math.PI * seg(t, 26.1, 26.6)) * 40 : 0;
  // rope
  if (!cut) stroke(k => [lerp(500, 660, k), 760 + Math.sin(k * Math.PI) * 30], 12, 6, '#7a5a3a');
  else { const d = eo(seg(t, 26.0, 26.5)); stroke(k => [lerp(500, 560, k), 760 + k * 60 * d], 6, 6, '#7a5a3a'); stroke(k => [lerp(610, 660, k), 760 - hop + (1 - k) * 60 * d], 6, 6, '#7a5a3a');
    const s = seg(t, 26.0, 26.4); if (s < 1) { ctx.save(); ctx.globalAlpha *= 1 - s; stroke(line(560, 720, 610, 800), 4, 7, RED); stroke(line(610, 720, 560, 800), 4, 7, RED); ctx.restore(); } }
  person(760, 860 - hop, { col: BLUE, seed: 31, mood: cut ? 'happy' : 'flat' });
  say('放过自己', 760, 420, 84, RED, eo(seg(t, 26.4, 26.8)));
  // 他 receives the "天赋" sash
  person(1450, 860, { col: ORANGE, seed: 21, crown: true });
  const sa = back(seg(t, 23.4, 23.9));
  if (sa > 0) at(1450, 700, sa, () => { const pts = rectPts(-150, -36, 300, 72); crayon(pts, RED, 150); inkLine(pts, 4); say('天赋', 0, 2, 56, WHITE, 1, 'center', false); }, -0.35);
}

function sPromo(t) {
  ground();
  for (let i = 0; i < 3; i++) box(1100 + i * 180, 860 - (i + 1) * 110, 1700 - (1100 + i * 180), (i + 1) * 110, i % 2 ? '#e2c38e' : '#d9b37a', 160 + i, 4);
  const k1 = eio(seg(t, 29.6, 30.4)), k2 = eio(seg(t, 30.4, 31.2));
  const x = t < 30.4 ? lerp(1010, 1190, k1) : lerp(1190, 1370, k2);
  const y = t < 30.4 ? lerp(860, 750, k1) - Math.sin(k1 * Math.PI) * 60 : lerp(750, 640, k2) - Math.sin(k2 * Math.PI) * 60;
  person(x, y, { s: 0.6, col: ORANGE, seed: 21, crown: true });
  say('+1 级', 1190, 520, 64, '#c9870f', eo(seg(t, 30.4, 30.7)) * (1 - seg(t, 31.4, 31.7)));
  say('+1 级', 1370, 410, 64, '#c9870f', eo(seg(t, 31.2, 31.5)));
  person(480, 860, { s: 0.85, col: BLUE, seed: 31, look: [10, -4] });
  bubble('人家脑子好使', 640, 400, 68, [520, 560], eo(seg(t, 31.8, 32.1)));
}

function sMarathon(t) {
  ground();
  stroke(line(1350, 860, 1350, 470), 6, 8); stroke(line(1650, 860, 1650, 470), 6, 8);
  box(1330, 440, 340, 90, RED, 170, 4); say('终点', 1500, 486, 60, WHITE, 1, 'center', false);
  say('42.195 公里', 1500, 380, 52, MUTED);
  const run = eio(seg(t, 34.9, 36.8)), x = lerp(880, 1520, run), broke = t > 36.3;
  if (!broke) stroke(line(1350, 700, 1650, 700), 8, 4, RED);
  else { const d = eo(seg(t, 36.3, 36.8)); stroke(line(1350, 700, 1350 + 60, 700 + 120 * d), 4, 4, RED); stroke(line(1650, 700, 1650 - 60, 700 + 120 * d), 4, 4, RED); }
  const bob = run < 1 ? Math.abs(Math.sin(t * 12)) * 16 : 0;
  person(x, 860 - bob, { s: 0.75, col: ORANGE, seed: 21, crown: true, mood: 'happy', arms: broke ? [[-100, -170, -170, -300], [100, -170, 170, -300]] : null });
  person(420, 860, { s: 0.85, col: BLUE, seed: 31, look: [10, 0] });
  bubble('他天生体质好', 620, 400, 68, [480, 560], eo(seg(t, 37.2, 37.5)));
}

function sGuitar(t) {
  ground();
  box(1360, 230, 240, 260, WHITE, 180, 4); box(1360, 230, 240, 56, RED, 181, 4);
  say('第3周', 1480, 390, 72, INK, 1, 'center', false);
  person(860, 860, { col: BLUE, seed: 31, mood: t > 43.2 ? 'sad' : 'flat', look: [10, 6] });
  guitar(790, 800, 1, -0.35);
  const blink = Math.floor(t * 4) % 2 ? 1 : 0.55;
  ctx.save(); ctx.globalAlpha *= blink; ctx.fillStyle = RED;
  for (const [x, y] of [[1030, 640], [1052, 662], [1010, 668]]) { ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill(); }
  ctx.restore();
  say('指尖磨破了', 1150, 560, 56, RED, eo(seg(t, 41.4, 41.7)), 'left');
  bubble('我没这根筋', 480, 400, 72, [700, 580], eo(seg(t, 43.4, 43.7)));
}

function sPardon(t) {
  const Q = ['人家脑子好使', '他天生体质好', '我没这根筋'];
  for (let i = 0; i < 3; i++) {
    const k = back(seg(t, 46.5 + i * 0.3, 47.0 + i * 0.3)); if (k <= 0) continue;
    const x = 420 + i * 540, y = lerp(1300, 640, k), rot = [-0.06, 0.03, -0.03][i];
    at(x, y, 1, () => { box(-210, -120, 420, 240, WHITE, 190 + i, 5); say(Q[i], 0, -30, 54, INK, 1, 'center', false);
      stamp('赦免', 30, 62, seg(t, 48.6 + i * 0.3, 48.9 + i * 0.3), -0.15, 52); }, rot);
  }
  say('【赦免】', 960, 260, 170, RED, eo(seg(t, 49.4, 49.8)));
}

function sTwoViews(t) {

  if (t > 58.8 && t < 63.6) { const c = ((t - 58.8) % 0.55) / 0.55; person(lerp(1820, 1640, c), 860, { s: 0.32, col: GREEN, seed: 220, mood: 'happy' }); }
  // the choice
  if (t > 65.0) { ctx.save(); ctx.globalAlpha *= eo(seg(t, 65.0, 65.4)); person(960, 860, { s: 0.55, col: BLUE, seed: 31, look: t > 67 ? [-14, 0] : [14, 0] }); ctx.restore(); }
  say('不必追', 480, 920, 60, BLUE, eo(seg(t, 65.4, 65.7)));
  say('逼你追', 1440, 920, 60, RED, eo(seg(t, 66.4, 66.7)));
}

function sSeesaw(t) {
  ground();

  const C = [960, 760], L = 560, cs = Math.cos(th), sn = Math.sin(th);
  const fulc = shapePts(k => { const i = Math.min(3, Math.floor(k * 3)); return [[900, 860], [960, 768], [1020, 860], [900, 860]][i]; }, 3, 2);
  crayon(fulc, GREY, 230); inkLine(fulc);
  at(C[0], C[1], 1, () => { box(-L, -16, 2 * L, 32, BROWN, 231, 4); say('比较', -300, 56, 56, INK, 1, 'center', false); }, th);
  person(C[0] + 480 * cs, C[1] + 480 * sn - 16, { s: 0.55, col: ORANGE, seed: 21, crown: true });
  if (drop > 0) { const bx = 230, by = -16 - 60; const y = t < 78.4 ? lerp(-400, C[1] + bx * sn + by, drop) : C[1] + bx * sn + by;
    at(C[0] + bx * cs, y, 1, () => { box(-120, -60, 240, 120, GOLD, 232, 5); say('天才', 0, 2, 72, INK, 1, 'center', false); }, t < 78.4 ? 0 : th); }
  // 你 steps off the plank
  const off = eio(seg(t, 79.4, 80.8));
  const lx = C[0] - 480 * cs, ly = C[1] - 480 * sn - 16;
  person(lerp(lx, 250, off), lerp(ly, 860, off) - Math.sin(off * Math.PI) * 120, { s: 0.55, col: BLUE, seed: 31, look: [-10, 0] });
  say('撤出比较', 280, 470, 72, RED, eo(seg(t, 80.4, 80.8)));
}

const FRAMES = [[420, '吉他'], [960, '全马'], [1500, '升职']];
function frameIcon(i, x) {
  if (i === 0) guitar(x + 60, 340, 0.35, -0.6);
  if (i === 1) { stroke(line(x + 110, 450, x + 110, 300), 4, 6); for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) if ((r + c) % 2 === 0) box(x + 110 + c * 22, 300 + r * 22, 22, 22, INK, 270 + r * 3 + c, 2); else inkLine(rectPts(x + 110 + c * 22, 300 + r * 22, 22, 22), 2); }
  if (i === 2) for (let s = 0; s < 3; s++) inkLine(shapePts(line(x + 40 + s * 40, 440 - s * 40, x + 80 + s * 40, 440 - s * 40), 4, 2), 5);
}
function absentFrames(t, alpha, cutX = -1e9) { // everything left of cutX has been erased
  FRAMES.forEach(([x, name], i) => {
    if (x + 200 < cutX) return;
    ctx.save(); ctx.globalAlpha *= alpha; if (x - 200 < cutX) { ctx.beginPath(); ctx.rect(cutX, 0, W - cutX, H); ctx.clip(); }
    const k = back(seg(t, 86.8 + i * 0.4, 87.3 + i * 0.4));
    at(x, 0, k, () => {
      box(-190, 230, 380, 380, '#fff8ea', 260 + i, 5);
      frameIcon(i, -190);
      person(-20, 590, { s: 0.6, ghost: true });
      say(name, 0, 660, 56, INK);
    });
    ctx.restore();
  });
}

}

function shrine(alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;

}
function sStatue(t) {

    arms: t > 104.6 ? [[100, -160, 230, -270]] : null });
  // dust from the sleeve
  if (t > 104.0) { const k = seg(t, 104.0, 106.0); const r = rng(9); ctx.save(); ctx.globalAlpha *= (1 - k) * 0.8;
    for (let i = 0; i < 16; i++) { ctx.fillStyle = '#9b8f80'; ctx.beginPath(); ctx.arc(x - 120 * s - 20 - r() * 140 * k, y - 150 * s - r() * 120 * k, 6 + r() * 8, 0, 7); ctx.fill(); } ctx.restore(); }
  say('袖口沾着灰', 420, 560, 64, INK, eo(seg(t, 104.1, 104.4)));
  if (t > 104.6) { at(x + 230 * s, y - 280 * s, 0.7 * s / 0.95, () => { blob(0, 0, 76, 46, SKIN, 320); for (let i = 0; i < 4; i++) blob(-54 + i * 30, -58, 13, 34, SKIN, 330 + i, 4);
      ctx.fillStyle = '#8a5530'; for (const [cx, cy] of [[-34, -14], [-6, -18], [22, -12], [2, 10], [-22, 8]]) { ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill(); } }); }

}

function sInside(t) {

const SCENES = [
  [0, 4.0, sTitle], [4.0, 14.6, sSigh], [14.6, 23.0, sNietzsche], [23.0, 29.4, sRelease],
  [29.4, 34.8, sPromo], [34.8, 40.2, sMarathon], [40.2, 46.4, sGuitar], [46.4, 51.4, sPardon],
  [51.4, 69.6, sTwoViews], [69.6, 74.6, sReason], [74.6, 82.0, sSeesaw], [82.0, 86.6, sBench],
  [86.6, 93.0, sAbsent], [93.0, 100.6, sForgot], [100.6, 107.0, sStatue], [107.0, 115.4, sInside],
  [115.4, 119.6, sYourBench], [119.6, 123.0, sCraft], [123.0, 126.0, sStart],
];
const SUBS = [
  [4.0, 6.6, '为什么听说“他是天才”，'], [6.6, 9.6, '你反而松了一口气？'],
  [9.6, 11.8, '这口气不是服气，'], [11.8, 14.6, '是开脱。'],

  [23.0, 26.0, '我们以为“天赋”是在夸别人，'], [26.0, 29.4, '其实是在放过自己。'],

  [40.2, 43.2, '你学吉他第三周，指尖磨破了，'], [43.2, 46.4, '你说：我没这根筋。'],
  [46.4, 49.4, '每一句，都是一张——'],
  [51.4, 54.2, '尼采把伟大分成两种看法。'], [54.2, 58.6, '一种是奇迹：从天而降，不问来路。'],
  [58.6, 61.6, '一种是手艺：一块一块垒起来，'], [61.6, 65.0, '每一块都有人在搬。'],
  [65.0, 69.6, '奇迹不必追，手艺却逼你追。'],
  [74.6, 77.2, '所以，那口气为什么会松？'], [77.2, 82.0, '因为“天才”两个字，把你从比较里撤了下来。'],
  [82.0, 86.6, '你没有输，因为你根本没有上场。'],
  [86.6, 90.0, '可代价是，在一个又一个本可以开始的地方，'], [90.0, 93.0, '你都——'],
  [93.0, 95.4, '没人记得你放弃过什么，'], [95.4, 97.6, '连你自己也不记得，'], [97.6, 100.6, '最后只剩一句：我不是那块料。'],
  [107.0, 110.2, '走近看，神龛里供着的从来不是奇迹，'], [110.2, 115.4, '是一张旧工作台，一双磨坏的手，一盏亮到深夜的灯。'],
  [115.4, 119.6, '而你面前，也摆着一张。'],
];

function render(t) {
  t = ((t % D) + D) % D;
  boil = rng(1000 + Math.floor(t * 8));
  paper();
  for (const [a, b, fn] of SCENES) {
    if (t < a || t >= b) continue;
    ctx.save(); ctx.globalAlpha = Math.min(a === 0 ? 1 : seg(t, a, a + 0.35), 1 - seg(t, b - 0.35, b)); fn(t); ctx.restore();
  }
  for (const [a, b, s] of SUBS) {
    if (t < a || t >= b) continue;
    say(s, 960, 1000, 64, INK, Math.min(seg(t, a, a + 0.2), 1 - seg(t, b - 0.15, b)));
  }
}

const q = new URLSearchParams(location.search);
if (q.has('t')) render(+q.get('t'));
else { let t0 = null; const loop = n => { if (t0 === null) t0 = n; render((n - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
